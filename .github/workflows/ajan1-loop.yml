name: Ajan 1 - Surekli Dongu (s1-7)

# "Gecelik" degil, "acik oldugu surece" (kullanici tercihi) - her 30 dakikada
# bir kontrol eder, bekleyen (sektor,sehir) cifti varsa bir grubunu isler,
# yoksa hizlica cikar. Manuel de tetiklenebilir (workflow_dispatch).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python bagimliliklarini kur
        run: |
          pip install python-dotenv supabase playwright requests
          playwright install --with-deps chromium

      - name: google-maps-scraper'i klonla + derle (onaylanmis kaynak - gosom/google-maps-scraper)
        run: |
          git clone --depth 1 https://github.com/gosom/google-maps-scraper agents/google-maps-scraper
          cd agents/google-maps-scraper
          go build -o google-maps-scraper .

      - name: playwright-go driver icin CDN atlatma (bilinen upstream hata)
        # playwright-go v0.6000.0, "1.60.0" surumunu playwright.azureedge.net'ten
        # indirmeye calisiyor ama bu CDN olu + bu surum hicbir mirror'da yok
        # (ayni sorun daha once yerelde de yasandi, cozum: gercek bir surumu
        # 1.60.0 olarak etiketleyip npm registry'den (calisiyor) almak).
        run: |
          mkdir -p ~/.cache/ms-playwright-go/1.60.0
          npm pack playwright-core@1.57.0 --silent
          tar xzf playwright-core-1.57.0.tgz
          sed -i 's/"version": "1.57.0"/"version": "1.60.0"/' package/package.json
          cp -r package ~/.cache/ms-playwright-go/1.60.0/package
          echo "PLAYWRIGHT_NODEJS_PATH=$(which node)" >> "$GITHUB_ENV"

      - name: Sonraki batch'i isle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agents/ajan1/run_next_batch.py
